spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  flyway:
    enabled: false

foodmate:
  security:
    cookie-secure: false
  runtime:
    stub-enabled: true
    # Stub 配置不依赖 RocketMQ，使用 HTTP 兼容通道完成本地契约验证。
    transport: http
    admission:
      enabled: false
    service-jwt:
      enabled: false

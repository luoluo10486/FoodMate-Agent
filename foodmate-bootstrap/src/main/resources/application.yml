spring:
  application:
    name: foodmate
  config:
    # Load local secrets without requiring every developer to export shell variables.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  profiles:
    default: local-stub
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  servlet:
    multipart:
      # Knowledge batches allow up to twenty 20 MiB files; keep the container limit
      # aligned with the application-level validation instead of Tomcat's 1 MiB default.
      max-file-size: ${FOODMATE_UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${FOODMATE_UPLOAD_MAX_REQUEST_SIZE:420MB}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: ${MAIL_PROTOCOL:smtps}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
  data:
    redis:
      url: ${REDIS_URL:redis://:foodmate-redis-change-me@localhost:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

foodmate:
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:foodmate-private}
  security:
    cookie-secure: ${FOODMATE_COOKIE_SECURE:true}
  runtime:
    stub-enabled: false
    contract-version: ${RUNTIME_CONTRACT_VERSION:v1}
    # 业务派发通道：http 是 M1-3 兼容/契约测试通道，rocketmq 是 ADR-0005 正式主通道。
    # 两者互斥，同一进程只能启用一个。
    transport: ${FOODMATE_AGENT_TRANSPORT:http}
    admission:
      # 开启后必须连接 Redis；Redis 不可用时新 Run 直接返回 503，不退回进程内计数。
      enabled: ${FOODMATE_AGENT_ADMISSION_ENABLED:false}
    rocketmq:
      name-server: ${FOODMATE_ROCKETMQ_NAMESRV_ADDR:localhost:9876}
      command-topic: ${FOODMATE_ROCKETMQ_TOPIC_AGENT_COMMAND:foodmate-agent-command-v1}
      event-topic: ${FOODMATE_ROCKETMQ_TOPIC_AGENT_EVENT:foodmate-agent-event-v1}
      proposal-topic: ${FOODMATE_ROCKETMQ_TOPIC_AGENT_PROPOSAL:foodmate-agent-proposal-v1}
      result-topic: ${FOODMATE_ROCKETMQ_TOPIC_AGENT_RESULT:foodmate-agent-result-v1}
      java-event-consumer-group: ${FOODMATE_ROCKETMQ_CONSUMER_GROUP_JAVA_AGENT_EVENT:foodmate-java-agent-event-v1}
      java-proposal-consumer-group: ${FOODMATE_ROCKETMQ_CONSUMER_GROUP_JAVA_AGENT_PROPOSAL:foodmate-java-agent-proposal-v1}
      producer-group: ${FOODMATE_ROCKETMQ_PRODUCER_GROUP_JAVA:foodmate-java-agent-command-producer-v1}
      send-timeout-ms: ${FOODMATE_ROCKETMQ_SEND_TIMEOUT_MS:3000}
      producer-max-retries: ${FOODMATE_ROCKETMQ_PRODUCER_MAX_RETRIES:3}
      consumer-max-retries: ${FOODMATE_ROCKETMQ_CONSUMER_MAX_RETRIES:8}
    service-jwt:
      enabled: ${RUNTIME_SERVICE_JWT_ENABLED:true}
      java-private-key: ${RUNTIME_JAVA_PRIVATE_KEY:}
      java-public-key: ${RUNTIME_JAVA_PUBLIC_KEY:}
      java-kid: ${RUNTIME_JAVA_KID:}
      python-public-key: ${RUNTIME_PYTHON_PUBLIC_KEY:}
  model:
    default-chat-model: qwen-plus
    default-embed-model: text-embedding-v4
    timeout-ms: 15000
  gateway:
    base-url: http://model-gateway.internal
    api-key: ${MODEL_GATEWAY_KEY:}
  rag:
    top-k: 12
    rerank-top-n: 5
    collection: foodmate_knowledge
  milvus:
    host: localhost
    port: 19530
    token: ${MILVUS_TOKEN:}
  mcp:
    read-timeout-ms: 5000
  sql-agent:
    readonly-enforced: true
    max-rows: 500
  tool:
    enabled:
      calculator: true
      time-parser: true
      knowledge-search: true
      database-query: true
      food-log-writer: true
      plan-validator: true
  audit:
    enabled: true
  agent:
    feedback:
      enabled: ${FOODMATE_AGENT_FEEDBACK_ENABLED:true}
      comment-max-length: ${FOODMATE_AGENT_FEEDBACK_COMMENT_MAX_LENGTH:1000}
      audit-high-risk-enabled: ${FOODMATE_AGENT_FEEDBACK_AUDIT_HIGH_RISK_ENABLED:true}

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: true
      logic-not-delete-value: false
  configuration:
    map-underscore-to-camel-case: true

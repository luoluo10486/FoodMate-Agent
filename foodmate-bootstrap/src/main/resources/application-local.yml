spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/FoodMate}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false

foodmate:
  runtime:
    stub-enabled: false
    admission:
      # 本地真实闭环也走 Redis 准入；临时关闭可设置 FOODMATE_AGENT_ADMISSION_ENABLED=false。
      enabled: ${FOODMATE_AGENT_ADMISSION_ENABLED:true}

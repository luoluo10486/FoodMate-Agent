spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/FoodMate}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false

foodmate:
  security:
    # 本地 HTTP 开发不能发送 Secure Cookie；生产 profile 继续默认开启 Secure。
    cookie-secure: ${FOODMATE_COOKIE_SECURE:false}
  runtime:
    stub-enabled: false
    admission:
      # 本地真实闭环也走 Redis 准入；临时关闭可设置 FOODMATE_AGENT_ADMISSION_ENABLED=false。
      enabled: ${FOODMATE_AGENT_ADMISSION_ENABLED:true}

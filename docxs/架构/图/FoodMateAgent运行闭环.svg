<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">FoodMate Agent 运行闭环</title><desc id="desc">用户请求经由 Java Outbox 和 RocketMQ 到 Python Runtime，再以事件回传。工具和 SQL 由 Java Tool Gateway 执行并回传 Result。</desc>
  <style>.bg{fill:#f7f9fc}.title{font:700 28px Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font:14px Arial,'Microsoft YaHei',sans-serif;fill:#33405a}.h{font:700 17px Arial,'Microsoft YaHei',sans-serif;fill:#172033}.note{font:12px Arial,'Microsoft YaHei',sans-serif;fill:#526079}.b{fill:#fff;stroke:#aebdd2;stroke-width:1.5;rx:8}.java{fill:#e8f0ff;stroke:#4a78c2}.py{fill:#fff5df;stroke:#bf7d18}.data{fill:#e9f8f0;stroke:#318264}.line{fill:none;stroke:#3978c6;stroke-width:3;marker-end:url(#a)}.tool{fill:none;stroke:#26835f;stroke-width:3;marker-end:url(#g)}.dash{fill:none;stroke:#cf8b22;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#o)}</style>
  <defs><marker id="a" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#3978c6"/></marker><marker id="g" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#26835f"/></marker><marker id="o" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#cf8b22"/></marker></defs>
  <rect class="bg" width="1280" height="620"/><text class="title" x="45" y="48">FoodMate Agent 运行闭环（2026-08-15）</text><text class="note" x="45" y="74">PostgreSQL 是业务真值；RocketMQ 至少一次投递；Outbox / Inbox、request hash 与幂等键吸收重复。</text>
  <rect class="b" x="40" y="175" width="145" height="90"/><text class="h" x="78" y="212">用户消息</text><text class="t" x="63" y="239">UI / 会话 API</text>
  <rect class="b java" x="250" y="145" width="205" height="150"/><text class="h" x="294" y="183">Java Application</text><text class="t" x="278" y="211">AgentRun + Dispatch</text><text class="t" x="278" y="237">PostgreSQL Outbox</text><text class="t" x="278" y="263">准入与状态机</text>
  <rect class="b data" x="525" y="160" width="175" height="120"/><text class="h" x="571" y="198">RocketMQ</text><text class="t" x="551" y="227">RunCommand / Event</text><text class="note" x="551" y="252">run_id 局部顺序</text>
  <rect class="b py" x="770" y="125" width="210" height="190"/><text class="h" x="810" y="163">Python Runtime</text><text class="t" x="799" y="192">Inbox / Checkpoint</text><text class="t" x="799" y="218">Workflow / Stub / Adapter</text><text class="t" x="799" y="244">Eval / Budget / Event Outbox</text><text class="note" x="799" y="273">仅接收授权上下文</text>
  <rect class="b java" x="1045" y="175" width="190" height="90"/><text class="h" x="1073" y="213">Java Event Inbox</text><text class="t" x="1075" y="239">SSE Outbox -> UI</text>
  <path class="line" d="M185 220H250"/><path class="line" d="M455 220H525"/><path class="line" d="M700 220H770"/><path class="line" d="M980 220H1045"/>
  <rect class="b py" x="770" y="420" width="210" height="105"/><text class="h" x="813" y="456">Tool / SQL Proposal</text><text class="t" x="800" y="484">只描述，不执行 SQL</text><text class="note" x="800" y="508">proposal_id + request_hash</text>
  <rect class="b java" x="450" y="405" width="220" height="135"/><text class="h" x="484" y="443">Java Tool Gateway</text><text class="t" x="478" y="472">Policy / SQL Guard</text><text class="t" x="478" y="498">审计、Result 发布</text><text class="note" x="478" y="523">claimed 超过 5 分钟可回收</text>
  <rect class="b data" x="145" y="420" width="220" height="105"/><text class="h" x="193" y="458">PostgreSQL</text><text class="t" x="171" y="486">SQL audit / 业务数据</text><text class="note" x="171" y="510">Java 是唯一业务权威</text>
  <path class="tool" d="M875 315V420"/><path class="tool" d="M770 472H670"/><path class="tool" d="M450 472H365"/><path class="tool" d="M670 440H735V375H925V315"/>
  <path class="dash" d="M875 125V92H1080V175"/><text class="note" x="865" y="109">完整真实模型、生产 RAG 和业务 Agent 流量仍待验证</text>
  <text class="note" x="45" y="580">真实联调已覆盖：PostgreSQL 认证/会话/消息，Java Outbox -> RocketMQ，Proposal -> Tool Gateway -> 审计 -> Result，M1-5 写确认与重复 Proposal 幂等。</text>
</svg>

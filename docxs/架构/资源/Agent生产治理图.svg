<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">FoodMate Agent 生产治理图</title><desc id="desc">展示请求从 Java 准入、Redis 并发、Python LangGraph、预算与 Eval 到安全交付的治理链路。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.lane{font-size:18px;font-weight:700}.t{font-size:16px;font-weight:700}.s{font-size:13px}.box{stroke:#334155;stroke-width:1.8;rx:7}.line{fill:none;stroke:#334155;stroke-width:1.8;marker-end:url(#a)}.dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="860" fill="#f8fafc"/><text x="720" y="42" text-anchor="middle" class="h">FoodMate Agent 生产治理链路</text>
  <rect x="35" y="70" width="1370" height="125" fill="#e8f0ff" class="box"/><text x="60" y="100" class="lane">Java 权威控制面</text>
  <rect x="80" y="120" width="190" height="55" fill="#fff" class="box"/><text x="175" y="153" text-anchor="middle" class="t">请求与幂等</text>
  <rect x="335" y="120" width="220" height="55" fill="#fff" class="box"/><text x="445" y="153" text-anchor="middle" class="t">Session 串行 / 队列</text>
  <rect x="620" y="120" width="220" height="55" fill="#fff" class="box"/><text x="730" y="153" text-anchor="middle" class="t">AgentRun / Dispatch</text>
  <rect x="905" y="120" width="190" height="55" fill="#fff" class="box"/><text x="1000" y="153" text-anchor="middle" class="t">Tool / SQL Policy</text>
  <rect x="1160" y="120" width="190" height="55" fill="#fff" class="box"/><text x="1255" y="153" text-anchor="middle" class="t">审计 / SSE</text>
  <path d="M270 147H335" class="line"/><path d="M555 147H620" class="line"/><path d="M840 147H905" class="line"/><path d="M1095 147H1160" class="line"/>

  <rect x="35" y="230" width="1370" height="115" fill="#f0eafe" class="box"/><text x="60" y="260" class="lane">Redis 技术协调（AOF）</text>
  <rect x="170" y="275" width="250" height="50" fill="#fff" class="box"/><text x="295" y="306" text-anchor="middle" class="t">用户 2 / 全局 20 Permit</text>
  <rect x="595" y="275" width="250" height="50" fill="#fff" class="box"/><text x="720" y="306" text-anchor="middle" class="t">优先队列 / Lease</text>
  <rect x="1020" y="275" width="250" height="50" fill="#fff" class="box"/><text x="1145" y="306" text-anchor="middle" class="t">Checkpoint / CAS / TTL</text>
  <path d="M445 175V275" class="dash"/><path d="M730 175V275" class="dash"/><path d="M1145 325V385" class="dash"/>

  <rect x="35" y="385" width="1370" height="285" fill="#eaf7ef" class="box"/><text x="60" y="417" class="lane">Python Agent Runtime（LangGraph 技术编排）</text>
  <rect x="80" y="455" width="175" height="65" fill="#fff4d8" class="box"/><text x="167" y="481" text-anchor="middle" class="t">Context Builder</text><text x="167" y="504" text-anchor="middle" class="s">摘要 + 最近 8 条</text>
  <rect x="315" y="455" width="175" height="65" fill="#fff" class="box"/><text x="402" y="493" text-anchor="middle" class="t">Router / Planner</text>
  <rect x="550" y="455" width="175" height="65" fill="#fff" class="box"/><text x="637" y="481" text-anchor="middle" class="t">Budget Manager</text><text x="637" y="504" text-anchor="middle" class="s">Token / 成本 / 超时</text>
  <rect x="785" y="455" width="175" height="65" fill="#fff" class="box"/><text x="872" y="481" text-anchor="middle" class="t">Execution</text><text x="872" y="504" text-anchor="middle" class="s">Model / RAG / Proposal</text>
  <rect x="1020" y="455" width="175" height="65" fill="#fdecec" class="box"/><text x="1107" y="481" text-anchor="middle" class="t">Step Validator</text><text x="1107" y="504" text-anchor="middle" class="s">确定性硬规则</text>
  <rect x="80" y="575" width="175" height="65" fill="#e9f7fb" class="box"/><text x="167" y="613" text-anchor="middle" class="t">Composer 缓冲</text>
  <rect x="315" y="575" width="175" height="65" fill="#ffe9ef" class="box"/><text x="402" y="601" text-anchor="middle" class="t">Final Eval</text><text x="402" y="624" text-anchor="middle" class="s">规则 + 分级 Judge</text>
  <rect x="550" y="575" width="175" height="65" fill="#fff4d8" class="box"/><text x="637" y="601" text-anchor="middle" class="t">动作裁决</text><text x="637" y="624" text-anchor="middle" class="s">交付 / 降级 / 确认</text>
  <rect x="785" y="575" width="175" height="65" fill="#dcfce7" class="box"/><text x="872" y="601" text-anchor="middle" class="t">Eval 后交付</text><text x="872" y="624" text-anchor="middle" class="s">answer_stream</text>
  <rect x="1020" y="575" width="175" height="65" fill="#fecaca" class="box"/><text x="1107" y="601" text-anchor="middle" class="t">Fail-safe</text><text x="1107" y="624" text-anchor="middle" class="s">无人审核时安全降级</text>
  <path d="M255 487H315" class="line"/><path d="M490 487H550" class="line"/><path d="M725 487H785" class="line"/><path d="M960 487H1020" class="line"/>
  <path d="M1107 520C1107 550 255 545 220 575" class="line"/><path d="M255 607H315" class="line"/><path d="M490 607H550" class="line"/><path d="M725 607H785" class="line"/><path d="M725 615H1020" class="line"/>
  <path d="M872 575C872 545 730 545 690 520" class="dash"/><text x="755" y="550" class="s">预算不足：有界退回</text>

  <rect x="35" y="710" width="1370" height="105" fill="#f1f5f9" class="box"/><text x="60" y="742" class="lane">可观测与用户体验</text>
  <text x="95" y="780" class="s">Trace：节点、模型、Token、成本、预算 revision、timeout、Eval、错误；默认不保存完整 Prompt、原始响应或 Chain-of-Thought。</text>
  <text x="95" y="805" class="s">前端：503 友好提示、安全重试；Eval 前仅显示业务进度；取消显示确定性部分摘要；反馈进入离线 Eval 候选流程。</text>
  <path d="M1255 175V710" class="dash"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">FoodMate RocketMQ 异步主链路</title>
  <desc id="desc">展示 PostgreSQL 业务真值、Redis 调度与 Python 技术状态、RocketMQ 跨运行时传输、Outbox Relay 和 Inbox 的职责。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker>
    <style>text{font-family:'Microsoft YaHei',sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.lane{font-size:18px;font-weight:700}.t{font-size:15px;font-weight:700}.s{font-size:12px}.box{stroke:#334155;stroke-width:1.7;rx:7}.line{fill:none;stroke:#334155;stroke-width:1.8;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="800" fill="#f8fafc"/>
  <text x="700" y="42" text-anchor="middle" class="h">FoodMate RocketMQ 异步主链路</text>

  <rect x="35" y="70" width="1330" height="145" fill="#e8f0ff" class="box"/>
  <text x="60" y="100" class="lane">Java 权威控制面 / PostgreSQL</text>
  <rect x="70" y="125" width="190" height="60" fill="#fff" class="box"/><text x="165" y="150" text-anchor="middle" class="t">AgentRun + 排队事实</text><text x="165" y="172" text-anchor="middle" class="s">业务真值</text>
  <rect x="315" y="125" width="190" height="60" fill="#fff" class="box"/><text x="410" y="150" text-anchor="middle" class="t">Dispatch + Outbox</text><text x="410" y="172" text-anchor="middle" class="s">不可变 envelope</text>
  <rect x="560" y="125" width="190" height="60" fill="#fff" class="box"/><text x="655" y="150" text-anchor="middle" class="t">Outbox Relay</text><text x="655" y="172" text-anchor="middle" class="s">Broker ACK -> published</text>
  <rect x="805" y="125" width="190" height="60" fill="#fff" class="box"/><text x="900" y="150" text-anchor="middle" class="t">MQ Inbox + 状态机</text><text x="900" y="172" text-anchor="middle" class="s">事务提交后 ACK</text>
  <rect x="1050" y="125" width="240" height="60" fill="#fff" class="box"/><text x="1170" y="150" text-anchor="middle" class="t">Tool / SQL Guard + SSE</text><text x="1170" y="172" text-anchor="middle" class="s">授权执行与前端交付</text>
  <path d="M260 155H315" class="line"/><path d="M505 155H560" class="line"/><path d="M995 155H1050" class="line"/>

  <rect x="35" y="245" width="1330" height="110" fill="#f0eafe" class="box"/>
  <text x="60" y="275" class="lane">Redis AOF：调度与 Python 技术状态</text>
  <rect x="120" y="292" width="250" height="45" fill="#fff" class="box"/><text x="245" y="320" text-anchor="middle" class="t">P0-P3 队列 / Permit / Lease</text>
  <rect x="575" y="292" width="250" height="45" fill="#fff" class="box"/><text x="700" y="320" text-anchor="middle" class="t">Python Inbox / Checkpoint</text>
  <rect x="1030" y="292" width="250" height="45" fill="#fff" class="box"/><text x="1155" y="320" text-anchor="middle" class="t">Event / Proposal Outbox</text>
  <path d="M165 185V292" class="dash"/><path d="M370 315C430 315 430 185 410 185" class="dash"/>

  <rect x="35" y="385" width="1330" height="135" fill="#fff4d8" class="box"/>
  <text x="60" y="415" class="lane">RocketMQ：跨运行时可靠运输（普通消息，至少一次）</text>
  <rect x="85" y="445" width="270" height="50" fill="#fff" class="box"/><text x="220" y="475" text-anchor="middle" class="t">agent.command.v1</text>
  <rect x="390" y="445" width="270" height="50" fill="#fff" class="box"/><text x="525" y="475" text-anchor="middle" class="t">agent.event.v1</text>
  <rect x="695" y="445" width="270" height="50" fill="#fff" class="box"/><text x="830" y="475" text-anchor="middle" class="t">agent.proposal.v1</text>
  <rect x="1000" y="445" width="270" height="50" fill="#fff" class="box"/><text x="1135" y="475" text-anchor="middle" class="t">agent.result.v1</text>
  <path d="M655 185V445" class="line"/><path d="M525 445C525 400 900 400 900 185" class="line"/>

  <rect x="35" y="550" width="1330" height="145" fill="#eaf7ef" class="box"/>
  <text x="60" y="580" class="lane">Python Agent Runtime / LangGraph</text>
  <rect x="95" y="610" width="210" height="55" fill="#fff" class="box"/><text x="200" y="643" text-anchor="middle" class="t">Command Consumer</text>
  <rect x="365" y="610" width="210" height="55" fill="#fff" class="box"/><text x="470" y="643" text-anchor="middle" class="t">Router / Planner</text>
  <rect x="635" y="610" width="210" height="55" fill="#fff" class="box"/><text x="740" y="643" text-anchor="middle" class="t">Model / Eval</text>
  <rect x="905" y="610" width="210" height="55" fill="#fff" class="box"/><text x="1010" y="635" text-anchor="middle" class="t">Event Outbox Relay</text><text x="1010" y="655" text-anchor="middle" class="s">Eval 后有界分片</text>
  <path d="M220 495V610" class="line"/><path d="M305 637H365" class="line"/><path d="M575 637H635" class="line"/><path d="M845 637H905" class="line"/>
  <path d="M1010 610C1010 550 525 550 525 495" class="line"/>
  <path d="M700 337V610" class="dash"/><path d="M1010 610C1120 560 1155 420 1155 337" class="dash"/>

  <rect x="35" y="725" width="1330" height="50" fill="#f1f5f9" class="box"/>
  <text x="700" y="755" text-anchor="middle" class="s">同一 run_id 局部有序；重复由 Inbox + request_hash + fencing 吸收；DLQ 只触发 Java 对账，不自动判定 AgentRun 失败。</text>
</svg>

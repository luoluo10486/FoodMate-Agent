<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">M1-4 Continuation 接续流程（同一 PostgreSQL 事务）</text>

  <!-- Run A 列 -->
  <rect x="40" y="70" width="260" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="170" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">Run A（旧 Run）</text>
  <text x="170" y="126" text-anchor="middle" font-size="13" fill="#92400e">status = waiting_user</text>
  <text x="170" y="146" text-anchor="middle" font-size="12" fill="#b45309">等待用户补充缺失参数</text>

  <!-- 用户消息 -->
  <rect x="380" y="70" width="220" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="490" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">用户补充消息</text>
  <text x="490" y="126" text-anchor="middle" font-size="12" fill="#1d4ed8">POST /api/sessions/{id}/messages</text>
  <text x="490" y="146" text-anchor="middle" font-size="12" fill="#1d4ed8">AgentRunCommandService</text>

  <!-- 事务框 -->
  <rect x="60" y="200" width="840" height="240" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="228" font-size="13" font-weight="bold" fill="#475569">createUserMessageRun 事务边界</text>

  <!-- 步骤1 -->
  <rect x="90" y="250" width="230" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="205" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">1. 创建 Run B</text>
  <text x="205" y="296" text-anchor="middle" font-size="11.5" fill="#15803d">parent_run_id = Run A</text>
  <text x="205" y="313" text-anchor="middle" font-size="11.5" fill="#15803d">continuation_reason = clarification</text>

  <!-- 步骤2 -->
  <rect x="360" y="250" width="230" height="76" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="475" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">2. Run A 迁移终态</text>
  <text x="475" y="292" text-anchor="middle" font-size="11.5" fill="#b91c1c">status: waiting_user → superseded</text>
  <text x="475" y="309" text-anchor="middle" font-size="11.5" fill="#b91c1c">superseded_by_run_id = Run B</text>

  <!-- 步骤3 -->
  <rect x="630" y="250" width="240" height="76" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="750" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">3. 旧 dispatch 出局</text>
  <text x="750" y="292" text-anchor="middle" font-size="11.5" fill="#a16207">dispatch 仲裁 → superseded</text>
  <text x="750" y="309" text-anchor="middle" font-size="11.5" fill="#a16207">pending outbox → expired</text>

  <!-- 步骤4/5 -->
  <rect x="90" y="350" width="360" height="70" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="270" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">4. Run A 写 SSE 终态事件 run.superseded</text>
  <text x="270" y="398" text-anchor="middle" font-size="11.5" fill="#4338ca">payload: superseded_by_run_id；前端展示"已由后续任务接续"</text>

  <rect x="500" y="350" width="370" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="685" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">5. Run B 固化初始预算/超时快照 + dispatch outbox</text>
  <text x="685" y="398" text-anchor="middle" font-size="11.5" fill="#15803d">agent_run_budget_snapshots revision=1（环境变量默认值）</text>

  <!-- 结果 -->
  <rect x="280" y="470" width="400" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="496" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">提交后 Run B 正常派发；Run A 迟到事件因 dispatch 非 active 被拒绝</text>
  <text x="480" y="516" text-anchor="middle" font-size="12" fill="#15803d">uk_agent_runs_parent_active 保证一个旧 Run 最多一个有效 continuation</text>

  <!-- 箭头 -->
  <line x1="300" y1="115" x2="378" y2="115" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="160" x2="490" y2="198" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="288" x2="358" y2="288" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="288" x2="628" y2="288" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="326" x2="300" y2="348" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="326" x2="700" y2="348" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="440" x2="480" y2="468" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>

[project]
name = "foodmate-agent-runtime"
version = "0.1.0"
description = "FoodMate Python Agent Runtime V1"
requires-python = ">=3.11"
dependencies = [
    "cryptography==49.0.0",
    "redis==6.4.0",
    "rocketmq-python-client==5.1.1",
]

[tool.setuptools]
py-modules = ["runtime_server", "mq_runtime", "agent_core", "model_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]

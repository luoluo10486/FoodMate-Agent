# FoodMate 本地单节点 RocketMQ Broker 配置。
# 仅用于本机开发：单 NameServer + 单 Broker，不配置生产集群、TLS 或 ACL。

brokerClusterName = FoodMateCluster
brokerName = foodmate-broker-a
brokerId = 0
brokerRole = ASYNC_MASTER

# Java 控制面与 Python Runtime 都跑在宿主机上，NameServer 必须向客户端
# 返回宿主机可达的 Broker 地址；容器内地址（172.x）宿主机路由不到。
# 当前本地开发机的宿主机地址；Java/Python 在宿主机运行，RocketMQ Proxy 在 Docker 中运行，
# 两侧都必须能访问这个地址。网络环境变化时，将其改为本机局域网 IPv4 地址。
# 本机当前宿主机与 Docker 容器都可访问的 IPv4；换网络后改成对应宿主机地址。
brokerIP1 = 10.0.1.70
listenPort = 10911

namesrvAddr = foodmate-rocketmq-namesrv:9876

# Topic 由 topic-init 显式创建。自动建 Topic 会掩盖配置错误，
# 并让契约化的 Topic 名（ADR-0005）失去约束力，因此本地也保持关闭。
autoCreateTopicEnable = false
autoCreateSubscriptionGroup = false

# 每天 04:00 清理过期 CommitLog；本地保留 72 小时足够回放调试。
deleteWhen = 04
fileReservedTime = 72

# 同步刷盘：Broker 确认发送成功即表示消息已落盘。Outbox Relay 依赖这个语义
# 才能安全地把消息标记为 published（ADR-0005「Outbox published 只表示 Broker 已确认」）。
flushDiskType = SYNC_FLUSH

# 本地开发缩小 CommitLog，避免一次性预分配 1GB 文件。
mapedFileSizeCommitLog = 134217728

# 消费失败重试次数上限；超过后进入所属 consumer group 的 DLQ。
# 与 FOODMATE_ROCKETMQ_CONSUMER_MAX_RETRIES 保持一致。
maxReconsumeTimes = 8

# 允许 mqadmin 在需要时下线/更新 Topic。
enablePropertyFilter = true
traceTopicEnable = false

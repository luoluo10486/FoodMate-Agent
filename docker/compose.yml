name: foodmate

services:
  postgres:
    image: postgres:16-alpine
    container_name: foodmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-FoodMate}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - foodmate-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [foodmate]

  redis:
    image: redis:7-alpine
    container_name: foodmate-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-foodmate-redis-change-me}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-foodmate-redis-change-me}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - foodmate-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDISCLI_AUTH}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [foodmate]

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: foodmate-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_REGION_NAME: ${MINIO_REGION:-us-east-1}
      TZ: ${TZ:-Asia/Shanghai}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - foodmate-minio-data-v2:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [foodmate]

  # RocketMQ 是 Java 控制面与 Python Runtime 的异步主通道（ADR-0005）。
  # 本地只部署单 NameServer + 单 Broker，不设计生产集群、TLS 或 ACL。
  #
  # 镜像里不存在 /home/rocketmq/{store,logs}，Docker 创建命名卷时会用 root 建目录，
  # 而进程以 uid 3000(rocketmq) 运行，直接挂载会因权限被拒而启动失败。
  # 这个一次性 root 容器先把属主交给 rocketmq，再放行 namesrv/broker。
  rocketmq-prepare:
    image: ${ROCKETMQ_IMAGE:-apache/rocketmq:5.2.0}
    container_name: foodmate-rocketmq-prepare
    restart: "no"
    user: root
    entrypoint: ["sh", "-c", "chown -R 3000:3000 /prepare && echo '[foodmate] RocketMQ 数据目录属主已就绪'"]
    volumes:
      - foodmate-rocketmq-namesrv-logs:/prepare/namesrv-logs
      - foodmate-rocketmq-broker-store:/prepare/broker-store
      - foodmate-rocketmq-broker-logs:/prepare/broker-logs
    networks: [foodmate]

  rocketmq-namesrv:
    image: ${ROCKETMQ_IMAGE:-apache/rocketmq:5.2.0}
    container_name: foodmate-rocketmq-namesrv
    restart: unless-stopped
    depends_on:
      rocketmq-prepare:
        condition: service_completed_successfully
    command: ["sh", "mqnamesrv"]
    environment:
      # 镜像默认给 NameServer 分配 4g 堆，本地开发不需要。
      # 本地默认使用较小堆；可通过环境变量覆盖，避免 Docker Desktop 内存紧张。
      JAVA_OPT_EXT: "-Xms${ROCKETMQ_NAMESRV_JAVA_XMS:-128m} -Xmx${ROCKETMQ_NAMESRV_JAVA_XMX:-256m} -Xmn${ROCKETMQ_NAMESRV_JAVA_XMN:-128m}"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    volumes:
      - foodmate-rocketmq-namesrv-logs:/home/rocketmq/logs
    healthcheck:
      # NameServer 没有 HTTP 探针；能建立 TCP 连接即视为可注册。
      test: ["CMD-SHELL", "timeout 2 sh -c '</dev/tcp/127.0.0.1/9876' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [foodmate]

  rocketmq-broker:
    image: ${ROCKETMQ_IMAGE:-apache/rocketmq:5.2.0}
    container_name: foodmate-rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    command: ["sh", "/home/rocketmq/start-broker.sh"]
    environment:
      # Broker 返回给 Java/Python 客户端的可达地址；本地网络变化时只改 .env，不改 broker.conf。
      ROCKETMQ_BROKER_IP1: ${ROCKETMQ_BROKER_IP1:-host.docker.internal}
      # 本地单 Broker 默认堆大小；生产环境应按消息量和磁盘吞吐单独评估。
      JAVA_OPT_EXT: "-Xms${ROCKETMQ_BROKER_JAVA_XMS:-256m} -Xmx${ROCKETMQ_BROKER_JAVA_XMX:-512m} -Xmn${ROCKETMQ_BROKER_JAVA_XMN:-256m}"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
      # 10909 是 VIP 通道端口，客户端在关闭 VIP 时也可能探测。
      - "${ROCKETMQ_BROKER_VIP_PORT:-10909}:10909"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - ./rocketmq/start-broker.sh:/home/rocketmq/start-broker.sh:ro
      # store 使用命名卷：Broker 重启后 CommitLog 与消费进度必须保留。
      - foodmate-rocketmq-broker-store:/home/rocketmq/store
      - foodmate-rocketmq-broker-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 sh -c '</dev/tcp/127.0.0.1/10911' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [foodmate]

  # Python RocketMQ 5.x 客户端使用 gRPC，需要通过本地 Proxy 访问单 Broker。
  # Proxy 不存储消息，也不增加 Broker 数量；生产部署时可横向扩展，当前仅保留一个本地实例。
  rocketmq-proxy:
    image: ${ROCKETMQ_IMAGE:-apache/rocketmq:5.2.0}
    container_name: foodmate-rocketmq-proxy
    restart: unless-stopped
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    command: ["sh", "mqproxy", "-pc", "/home/rocketmq/conf/rmq-proxy.json"]
    environment:
      # Proxy 只负责协议转发，本地开发不需要大堆。
      JAVA_OPT_EXT: "-Xms${ROCKETMQ_PROXY_JAVA_XMS:-128m} -Xmx${ROCKETMQ_PROXY_JAVA_XMX:-256m} -Xmn${ROCKETMQ_PROXY_JAVA_XMN:-128m}"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ROCKETMQ_PROXY_GRPC_PORT:-8081}:8081"
      - "${ROCKETMQ_PROXY_REMOTING_PORT:-8080}:8080"
    volumes:
      - ./rocketmq/rmq-proxy.json:/home/rocketmq/conf/rmq-proxy.json:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 sh -c '</dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks: [foodmate]

  # 一次性 Topic/consumer group 初始化。共享 Broker 的网络命名空间，
  # 这样 mqadmin 的 127.0.0.1:10911 才等于 Broker 自身注册的地址。
  rocketmq-init:
    image: ${ROCKETMQ_IMAGE:-apache/rocketmq:5.2.0}
    container_name: foodmate-rocketmq-init
    restart: "no"
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    network_mode: "service:rocketmq-broker"
    entrypoint: ["sh", "/foodmate/init-topics.sh"]
    environment:
      ROCKETMQ_VERSION: ${ROCKETMQ_VERSION:-5.2.0}
      NAMESRV_ADDR: foodmate-rocketmq-namesrv:9876
      BROKER_ADDR: 127.0.0.1:10911
      TOPIC_AGENT_COMMAND: ${FOODMATE_ROCKETMQ_TOPIC_AGENT_COMMAND:-foodmate-agent-command-v1}
      TOPIC_AGENT_EVENT: ${FOODMATE_ROCKETMQ_TOPIC_AGENT_EVENT:-foodmate-agent-event-v1}
      TOPIC_AGENT_PROPOSAL: ${FOODMATE_ROCKETMQ_TOPIC_AGENT_PROPOSAL:-foodmate-agent-proposal-v1}
      TOPIC_AGENT_RESULT: ${FOODMATE_ROCKETMQ_TOPIC_AGENT_RESULT:-foodmate-agent-result-v1}
      TOPIC_KNOWLEDGE_INDEX: ${FOODMATE_ROCKETMQ_TOPIC_KNOWLEDGE_INDEX:-foodmate-knowledge-index-v1}
      TOPIC_KNOWLEDGE_INDEX_RESULT: ${FOODMATE_ROCKETMQ_TOPIC_KNOWLEDGE_INDEX_RESULT:-foodmate-knowledge-index-result-v1}
      TOPIC_KNOWLEDGE_VISIBILITY: ${FOODMATE_ROCKETMQ_TOPIC_KNOWLEDGE_VISIBILITY:-foodmate-knowledge-visibility-v1}
      TOPIC_KNOWLEDGE_PURGE: ${FOODMATE_ROCKETMQ_TOPIC_KNOWLEDGE_PURGE:-foodmate-knowledge-purge-v1}
      TOPIC_KNOWLEDGE_PURGE_RESULT: ${FOODMATE_ROCKETMQ_TOPIC_KNOWLEDGE_PURGE_RESULT:-foodmate-knowledge-purge-result-v1}
      # 本地单 Python Runtime 使用单队列；扩展消费者实例时再提高该值。
      TOPIC_QUEUE_COUNT: ${FOODMATE_ROCKETMQ_TOPIC_QUEUE_COUNT:-1}
      GROUP_JAVA_AGENT_EVENT: ${FOODMATE_ROCKETMQ_CONSUMER_GROUP_JAVA_AGENT_EVENT:-foodmate-java-agent-event-v1}
      GROUP_JAVA_AGENT_PROPOSAL: ${FOODMATE_ROCKETMQ_CONSUMER_GROUP_JAVA_AGENT_PROPOSAL:-foodmate-java-agent-proposal-v1}
      GROUP_PYTHON_AGENT_COMMAND: ${FOODMATE_ROCKETMQ_CONSUMER_GROUP_PYTHON_AGENT_COMMAND:-foodmate-python-agent-command-v1}
      GROUP_PYTHON_AGENT_RESULT: ${FOODMATE_ROCKETMQ_CONSUMER_GROUP_PYTHON_AGENT_RESULT:-foodmate-python-agent-result-v1}
      GROUP_PYTHON_KNOWLEDGE_INDEX: ${FOODMATE_ROCKETMQ_CONSUMER_GROUP_PYTHON_KNOWLEDGE_INDEX:-foodmate-python-knowledge-index-v1}
      GROUP_JAVA_KNOWLEDGE_INDEX_RESULT: ${FOODMATE_ROCKETMQ_CONSUMER_GROUP_JAVA_KNOWLEDGE_INDEX_RESULT:-foodmate-java-knowledge-index-result-v1}
      GROUP_PYTHON_KNOWLEDGE_VISIBILITY: ${FOODMATE_ROCKETMQ_CONSUMER_GROUP_PYTHON_KNOWLEDGE_VISIBILITY:-foodmate-python-knowledge-visibility-v1}
      GROUP_PYTHON_KNOWLEDGE_PURGE: ${FOODMATE_ROCKETMQ_CONSUMER_GROUP_PYTHON_KNOWLEDGE_PURGE:-foodmate-python-knowledge-purge-v1}
      GROUP_JAVA_KNOWLEDGE_PURGE_RESULT: ${FOODMATE_ROCKETMQ_CONSUMER_GROUP_JAVA_KNOWLEDGE_PURGE_RESULT:-foodmate-java-knowledge-purge-result-v1}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./rocketmq/init-topics.sh:/foodmate/init-topics.sh:ro

  # M2-1 real local RAG backend. Stub mode does not require these services.
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: foodmate-milvus-etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: [foodmate-milvus-etcd:/etcd]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [foodmate]

  milvus-minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: foodmate-milvus-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ROOT_USER:-milvus}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_ROOT_PASSWORD:-milvus-minio-change-me}
    volumes: [foodmate-milvus-minio:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [foodmate]

  milvus:
    image: milvusdb/milvus:v2.5.5
    container_name: foodmate-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ROOT_USER:-milvus}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_ROOT_PASSWORD:-milvus-minio-change-me}
    depends_on:
      milvus-etcd: { condition: service_healthy }
      milvus-minio: { condition: service_healthy }
    ports: ["${MILVUS_PORT:-19530}:19530"]
    volumes: [foodmate-milvus-data:/var/lib/milvus]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9091/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks: [foodmate]

  # Java 控制面容器。默认 local profile 只使用本地 deterministic/stub 配置，
  # 不由镜像携带数据库迁移或任何外部服务凭据。
  foodmate:
    build:
      context: ..
      dockerfile: docker/java.Dockerfile
    container_name: ${FOODMATE_APP_CONTAINER_NAME:-foodmate}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rocketmq-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-FoodMate}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://:${REDIS_PASSWORD:-foodmate-redis-change-me}@redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-foodmate-private}
      FOODMATE_COOKIE_SECURE: "false"
      FOODMATE_AGENT_TRANSPORT: rocketmq
      FOODMATE_AGENT_ADMISSION_ENABLED: "true"
      FOODMATE_ROCKETMQ_NAMESRV_ADDR: foodmate-rocketmq-namesrv:9876
      FOODMATE_ROCKETMQ_TOPIC_KNOWLEDGE_INDEX: ${FOODMATE_ROCKETMQ_TOPIC_KNOWLEDGE_INDEX:-foodmate-knowledge-index-v1}
      FOODMATE_ROCKETMQ_TOPIC_KNOWLEDGE_INDEX_RESULT: ${FOODMATE_ROCKETMQ_TOPIC_KNOWLEDGE_INDEX_RESULT:-foodmate-knowledge-index-result-v1}
      FOODMATE_ROCKETMQ_TOPIC_KNOWLEDGE_VISIBILITY: ${FOODMATE_ROCKETMQ_TOPIC_KNOWLEDGE_VISIBILITY:-foodmate-knowledge-visibility-v1}
      FOODMATE_ROCKETMQ_CONSUMER_GROUP_JAVA_KNOWLEDGE_INDEX_RESULT: ${FOODMATE_ROCKETMQ_CONSUMER_GROUP_JAVA_KNOWLEDGE_INDEX_RESULT:-foodmate-java-knowledge-index-result-v1}
      FOODMATE_ROCKETMQ_CONSUMER_GROUP_JAVA_KNOWLEDGE_PURGE_RESULT: ${FOODMATE_ROCKETMQ_CONSUMER_GROUP_JAVA_KNOWLEDGE_PURGE_RESULT:-foodmate-java-knowledge-purge-result-v1}
      RUNTIME_SERVICE_JWT_ENABLED: "false"
      FOODMATE_RAG_MODE: ${FOODMATE_RAG_MODE:-stub}
    ports:
      - "${FOODMATE_APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    networks: [foodmate]

  # Python Agent Runtime 与知识索引 Worker。它不连接 PostgreSQL，Java 仍是业务权威。
  agent-runtime:
    build:
      context: ..
      dockerfile: docker/python.Dockerfile
    container_name: ${FOODMATE_AGENT_CONTAINER_NAME:-foodmate-agent-runtime}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rocketmq-proxy:
        condition: service_healthy
      foodmate:
        condition: service_healthy
    environment:
      PORT: "9000"
      FOODMATE_BIND_HOST: 0.0.0.0
      JAVA_CALLBACK_URL: http://foodmate:8080
      FOODMATE_CONTRACT_VERSION: v1
      FOODMATE_SERVICE_JWT_ENABLED: "false"
      FOODMATE_AGENT_TRANSPORT: rocketmq
      FOODMATE_AGENT_CHECKPOINT_BACKEND: redis
      FOODMATE_AGENT_CHECKPOINT_ENCRYPTION_ENABLED: "false"
      FOODMATE_REDIS_URL: redis://:${REDIS_PASSWORD:-foodmate-redis-change-me}@redis:6379
      FOODMATE_ROCKETMQ_PROXY_ADDR: foodmate-rocketmq-proxy:8081
      FOODMATE_ROCKETMQ_CONSUMER_GROUP_PYTHON_KNOWLEDGE_INDEX: ${FOODMATE_ROCKETMQ_CONSUMER_GROUP_PYTHON_KNOWLEDGE_INDEX:-foodmate-python-knowledge-index-v1}
      FOODMATE_ROCKETMQ_CONSUMER_GROUP_PYTHON_KNOWLEDGE_VISIBILITY: ${FOODMATE_ROCKETMQ_CONSUMER_GROUP_PYTHON_KNOWLEDGE_VISIBILITY:-foodmate-python-knowledge-visibility-v1}
      FOODMATE_ROCKETMQ_CONSUMER_GROUP_PYTHON_KNOWLEDGE_PURGE: ${FOODMATE_ROCKETMQ_CONSUMER_GROUP_PYTHON_KNOWLEDGE_PURGE:-foodmate-python-knowledge-purge-v1}
      FOODMATE_KNOWLEDGE_INDEX_WORKER_ENABLED: "true"
      FOODMATE_RAG_MODE: ${FOODMATE_RAG_MODE:-stub}
      FOODMATE_RAG_EMBEDDING_PROVIDER: ${FOODMATE_RAG_EMBEDDING_PROVIDER:-deterministic}
      FOODMATE_RAG_EMBEDDING_MODEL: ${FOODMATE_RAG_EMBEDDING_MODEL:-deterministic-local-v1}
      FOODMATE_RAG_STUB_REDIS_PREFIX: ${FOODMATE_RAG_STUB_REDIS_PREFIX:-foodmate:rag:stub}
      FOODMATE_KNOWLEDGE_MINIO_ENDPOINT: minio:9000
      FOODMATE_KNOWLEDGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      FOODMATE_KNOWLEDGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      FOODMATE_KNOWLEDGE_MINIO_BUCKET: ${MINIO_BUCKET:-foodmate-private}
    ports:
      - "${FOODMATE_AGENT_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/foodmate/internal/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [foodmate]

volumes:
  foodmate-postgres-data:
  foodmate-redis-data:
  foodmate-minio-data:
  foodmate-minio-data-v2:
  foodmate-rocketmq-namesrv-logs:
  foodmate-rocketmq-broker-store:
  foodmate-rocketmq-broker-logs:
  foodmate-milvus-etcd:
  foodmate-milvus-minio:
  foodmate-milvus-data:

networks:
  foodmate:
    name: foodmate
    driver: bridge
